# Release automation.
#
# Every push to main runs Release Please, which maintains a "release PR" that
# accumulates the conventional-commit changelog and the next version number.
# Merging that PR pushes to main again, and on that run Release Please tags the
# commit and cuts the GitHub release — which gates the build job below.
name: Release

on:
  push:
    branches: [ "main" ]

# Least privilege by default; each job opts into exactly what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create tags and releases
      pull-requests: write  # open and groom the release PR
      issues: write         # apply the autorelease:* labels
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  artifacts:
    name: Build and publish release artifacts
    needs: release-please
    # Only runs on the push that actually cut a release, i.e. the release PR merge.
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # upload assets to the release
      id-token: write      # OIDC token used to sign the provenance attestation
      attestations: write  # record the attestation against the repository
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Cross-compile release binaries
        run: |
          set -euo pipefail
          mkdir -p dist

          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${platform%/*}"
            goarch="${platform#*/}"

            staging="$(mktemp -d)"
            bin="kubectl-forwarder"
            if [ "$goos" = "windows" ]; then
              bin="kubectl-forwarder.exe"
            fi

            echo "building ${goos}/${goarch}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build \
                -trimpath \
                -ldflags "-s -w -X main.version=${VERSION}" \
                -o "${staging}/${bin}" .

            cp LICENSE README.md "${staging}/"

            archive="kubectl-forwarder_${VERSION}_${goos}_${goarch}"
            if [ "$goos" = "windows" ]; then
              (cd "${staging}" && zip -q -r - .) > "dist/${archive}.zip"
            else
              tar -czf "dist/${archive}.tar.gz" -C "${staging}" .
            fi
          done

          # Glob is expanded before the redirect target exists, but name the
          # inputs explicitly so checksums.txt can never checksum itself.
          (cd dist && sha256sum kubectl-forwarder_* > checksums.txt)
          cat dist/checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: Upload artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG_NAME" dist/* --clobber
